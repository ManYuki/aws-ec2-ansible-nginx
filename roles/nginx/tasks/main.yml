---
- name: Install Nginx web server
  dnf:
    name: "{{ nginx_package_name }}"
    state: present

- name: Ensure Nginx service is started and enabled on boot
  service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: yes

- name: Deploy dynamic index.html from Jinja2 template
  template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: "{{ nginx_index_mode }}"
  notify: Restart Nginx
